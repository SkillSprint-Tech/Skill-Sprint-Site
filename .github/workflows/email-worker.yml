# Drains the SkillSprint email queue every 6 hours.
#
# Vercel Hobby crons only run once per day, so this supplies the 6-hourly cadence.
# vercel.json also keeps a daily cron as a backstop, and /api/register triggers the
# worker inline, so a normal signup gets its email in seconds rather than waiting.
#
# Setup (one time), in GitHub → Settings → Secrets and variables → Actions:
#   SITE_URL     e.g. https://skill-sprint.pk
#   CRON_SECRET  must match the CRON_SECRET set in Vercel
#
# Caveat: GitHub disables scheduled workflows after 60 days with no repo activity,
# and scheduled runs can be delayed when GitHub is busy. The Vercel daily cron covers
# the gap. Run it by hand any time from the Actions tab.

name: Email worker

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

jobs:
  drain-queue:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger the email worker
        run: |
          if [ -z "${{ secrets.SITE_URL }}" ] || [ -z "${{ secrets.CRON_SECRET }}" ]; then
            echo "::error::SITE_URL and CRON_SECRET repository secrets must both be set."
            exit 1
          fi

          response=$(curl --silent --show-error --fail-with-body \
            --max-time 90 \
            --write-out '\n%{http_code}' \
            --header "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            "${{ secrets.SITE_URL }}/api/cron")

          status=$(echo "$response" | tail -n1)
          body=$(echo "$response" | sed '$d')

          echo "HTTP $status"
          echo "$body"

          if [ "$status" != "200" ]; then
            echo "::error::Worker returned HTTP $status"
            exit 1
          fi
